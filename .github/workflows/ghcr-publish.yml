# Builds the Sub2API container image and publishes it to the GitHub Container
# Registry package that belongs to this repository's owner.
#
# Authentication uses the built-in GITHUB_TOKEN, so the workflow is
# self-sufficient: no repository secret has to be created by hand.
#
# TRIGGERS ARE DELIBERATELY PUSH-ONLY. The job runs on a self-hosted runner
# whose Docker daemon is privileged; `pull_request`, `pull_request_target`,
# `workflow_run` and `issue_comment` triggers would let code from an
# unreviewed fork execute on that host and MUST NOT be added here.
#
# Note: this repository also carries `release.yml`, which publishes GHCR images
# through GoReleaser on `v*` tags. If both are enabled, a tag push builds the
# same image twice; disable one of them for the tag event you care about.
#
# The `chart` job additionally publishes deploy/helm/sub2api as an OCI artifact
# to oci://ghcr.io/<owner>/charts/sub2api. That exists so a GitOps controller
# can pull just the chart: resolving this chart from a `GitRepository` source
# clones the whole ~107 MB repository, which is more than a memory-capped
# source-controller can absorb.
name: Publish image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Actions Runner Controller scale set on the owner's cluster. It is
    # linux/amd64 only and CPU-tight, so this job builds a single architecture
    # and never emulates one under QEMU.
    runs-on: pure-vps-linux-x64-sub2api
    timeout-minutes: 90

    env:
      REGISTRY: ghcr.io
      # ghcr.io/<owner>/<repo>, lowercased below because image references may
      # not contain uppercase characters.
      PUSH_IMAGE: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
      PLATFORMS: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve image name and build metadata
        id: meta_inputs
        env:
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          image="$(printf '%s' "${REGISTRY}/${OWNER_REPO}" | tr '[:upper:]' '[:lower:]')"

          version=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"

          echo "Image:     ${image}"
          echo "Version:   ${version:-<untagged build>}"
          echo "Push:      ${PUSH_IMAGE}"
          echo "Platforms: ${PLATFORMS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta_inputs.outputs.image }}
          labels: |
            org.opencontainers.image.title=Sub2API
            org.opencontainers.image.description=AI API gateway platform for subscription quota distribution
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta_inputs.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta_inputs.outputs.created }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile defaults GOPROXY/GOSUMDB to the mainland-China
          # mirrors; override them for a runner outside that network.
          build-args: |
            VERSION=${{ steps.meta_inputs.outputs.version }}
            COMMIT=${{ steps.meta_inputs.outputs.revision }}
            DATE=${{ steps.meta_inputs.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          {
            if [ "${PUSH_IMAGE}" = "true" ]; then
              echo "### Published to GHCR"
            else
              echo "### Build-only run — nothing was pushed"
            fi
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Digest | \`${IMAGE_DIGEST:-n/a}\` |"
            echo "| Platforms | \`${PLATFORMS}\` |"
            echo
            echo "Tags:"
            echo
            printf '%s\n' "${IMAGE_TAGS}" | while IFS= read -r tag; do
              [ -n "${tag}" ] && printf -- '- %s\n' "${tag}"
            done
            echo
            echo "A GHCR package is **private** when it is first created."
            echo "Make it public once, under Packages -> sub2api -> Package settings"
            echo "-> Change visibility, or an anonymous \`docker pull\` will fail."
          } >>"$GITHUB_STEP_SUMMARY"

  chart:
    name: Package and publish Helm chart
    # Same self-hosted scale set as the image job, for the same reasons.
    runs-on: pure-vps-linux-x64-sub2api
    timeout-minutes: 15
    # The chart's `image.tag` falls back to .Chart.AppVersion, so a chart is
    # only worth publishing once the image it points at has actually been
    # pushed. A failed image build must not leave a dangling chart behind.
    needs: publish

    env:
      CHART_DIR: deploy/helm/sub2api
      # Mirrors the image job's dry-run switch, so `workflow_dispatch` with
      # `push_image` unchecked packages the chart but publishes nothing.
      PUSH_CHART: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Resolve chart version
        id: chart
        run: |
          set -euo pipefail

          # Base version declared in Chart.yaml, stripped of any pre-release or
          # build-metadata suffix so we can append our own.
          base="$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' "${CHART_DIR}/Chart.yaml")"
          base="${base%%-*}"
          base="${base%%+*}"
          if [ -z "${base}" ]; then
            echo "::error::could not read version: from ${CHART_DIR}/Chart.yaml"
            exit 1
          fi

          # A chart version MUST be valid SemVer, and it must be unique: a
          # registry happily overwrites an existing tag, and Flux would then
          # keep serving whatever it cached first.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Release build. `v1.2.3` -> chart 1.2.3, matching the image tag
            # that docker/metadata-action produced from the same tag.
            version="${GITHUB_REF_NAME#v}"
            app_version="${version}"
          else
            # Branch build. SemVer pre-release, so it sorts *below* the eventual
            # release of the same base version. The run number keeps ordering
            # monotonic and the `g`-prefixed short SHA keeps it unique and
            # non-numeric (a bare numeric identifier with a leading zero would
            # be invalid SemVer).
            slug="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's/[^0-9A-Za-z-]/-/g')"
            version="${base}-${slug}.${GITHUB_RUN_NUMBER}.g${GITHUB_SHA:0:7}"
            # appVersion is left as declared in Chart.yaml on branch builds.
            app_version=""
          fi

          {
            echo "version=${version}"
            echo "app_version=${app_version}"
          } >>"$GITHUB_OUTPUT"

          echo "Chart version: ${version}"
          echo "appVersion:    ${app_version:-<as declared in Chart.yaml>}"
          echo "Push:          ${PUSH_CHART}"

      - name: Package chart
        id: package
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_APP_VERSION: ${{ steps.chart.outputs.app_version }}
        run: |
          set -euo pipefail

          mkdir -p dist

          # `helm package` does not render templates, so it needs none of the
          # credentials this chart demands at install time. It does validate the
          # SemVer we just built, and fails loudly if it is malformed.
          if [ -n "${CHART_APP_VERSION}" ]; then
            helm package "${CHART_DIR}" \
              --version "${CHART_VERSION}" \
              --app-version "${CHART_APP_VERSION}" \
              --destination dist
          else
            helm package "${CHART_DIR}" \
              --version "${CHART_VERSION}" \
              --destination dist
          fi

          # Glob rather than `ls`, so the name never round-trips through
          # word splitting.
          shopt -s nullglob
          packaged=(dist/*.tgz)
          if [ "${#packaged[@]}" -ne 1 ]; then
            echo "::error::expected exactly one packaged chart, got ${#packaged[@]}"
            exit 1
          fi

          echo "file=${packaged[0]}" >>"$GITHUB_OUTPUT"
          echo "Packaged ${packaged[0]}"

      - name: Log in to GHCR
        if: env.PUSH_CHART == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same built-in credential the image job uses; `packages: write` is
          # already granted above. No repository secret is involved.
          printf '%s' "${GITHUB_TOKEN}" \
            | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push chart
        id: push
        if: env.PUSH_CHART == 'true'
        env:
          CHART_FILE: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="oci://ghcr.io/${owner}/charts"

          helm push "${CHART_FILE}" "${repo}"

          echo "ref=${repo}/sub2api" >>"$GITHUB_OUTPUT"

      - name: Log out of GHCR
        if: always()
        run: helm registry logout ghcr.io || true

      - name: Summary
        env:
          CHART_REF: ${{ steps.push.outputs.ref }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          {
            if [ "${PUSH_CHART}" = "true" ]; then
              echo "### Helm chart published"
              echo
              echo "\`${CHART_REF}:${CHART_VERSION}\`"
              echo
              echo "Consume it from Flux without cloning this repository:"
              echo '```yaml'
              echo "apiVersion: source.toolkit.fluxcd.io/v1"
              echo "kind: HelmRepository"
              echo "spec:"
              echo "  type: oci"
              echo "  url: ${CHART_REF%/sub2api}"
              echo '```'
              echo
              echo "A GHCR package is **private** when it is first created."
              echo "Make \`charts/sub2api\` public once under the owner's package"
              echo "settings, or an anonymous pull will fail."
            else
              echo "### Chart packaged only — nothing was pushed"
              echo
              echo "Version: \`${CHART_VERSION}\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
