{{- /*
Only rendered when `auth.existingSecret` is empty. With an existing Secret the
chart writes no credential at all, which is what lets External Secrets
Operator, sealed-secrets or SOPS own them instead.
*/ -}}
{{- if eq (include "sub2api.createSecret" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sub2api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sub2api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.keys.databasePassword }}: {{ .Values.auth.databasePassword | quote }}
  {{ .Values.auth.keys.jwtSecret }}: {{ .Values.auth.jwtSecret | quote }}
  {{ .Values.auth.keys.totpEncryptionKey }}: {{ .Values.auth.totpEncryptionKey | quote }}
  {{- if .Values.auth.redisPassword }}
  {{ .Values.auth.keys.redisPassword }}: {{ .Values.auth.redisPassword | quote }}
  {{- end }}
  {{- if .Values.auth.adminPassword }}
  {{ .Values.auth.keys.adminPassword }}: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
{{- end }}
